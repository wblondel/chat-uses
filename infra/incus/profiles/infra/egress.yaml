# Rendered with envsubst by infra/host/bootstrap.sh, then applied with
# `incus profile edit --project infra`. Replaced on every run.
#
# Create the instance with its fixed address, e.g.:
#   incus launch <image> egress --project infra -p egress --device eth0,ipv4.address=${EGRESS_IP}
description: "Allowlisting HTTP(S) proxy, the only internet path for targets"
config:
  boot.autostart: "true"
  boot.autostart.priority: "40"
  limits.cpu: "${CPUS_SHARED}"
  limits.cpu.priority: "8"
  limits.memory: "${MEM_EGRESS}"
  limits.memory.swap: "false"
  security.privileged: "false"
  security.nesting: "false"
devices:
  root:
    type: disk
    path: /
    pool: "${POOL_NAME}"
    size: "${DISK_EGRESS}"
  eth0:
    type: nic
    name: eth0
    network: "${INFRANET_NAME}"
    security.mac_filtering: "true"
    security.ipv4_filtering: "true"
