# chat-uses host kernel settings. Installed by infra/host/bootstrap.sh
# as /etc/sysctl.d/60-chat-uses.conf.

# Containers must not read host kernel logs or kernel pointers.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# Routing between infranet, chatnet and the WireGuard tunnel.
# The host firewall decides what is actually allowed.
net.ipv4.ip_forward = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Recommended by Incus for hosts running many containers.
fs.inotify.max_queued_events = 1048576
fs.inotify.max_user_instances = 1048576
fs.inotify.max_user_watches = 1048576
vm.max_map_count = 262144
kernel.keys.maxkeys = 2000
kernel.keys.maxbytes = 2000000
