# chat-uses MediaMTX (chat-bcast-mediamtx.service). The encoder publishes
# "live" over RTSP; the forwarder reads it and pushes it to YouTube, so a
# YouTube outage never restarts the encoder. RTSP and RTMP stay on localhost;
# HLS on :8888 is a preview for the admin tunnel (http://BCAST_IP:8888/live/).
logLevel: warn
api: no
metrics: no
pprof: no
playback: no

rtsp: yes
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554

rtmp: yes
rtmpAddress: 127.0.0.1:1935

hls: yes
hlsAddress: :8888

webrtc: no
srt: no
# MediaMTX turns on Media over QUIC by default; nothing here uses it.
moq: no

paths:
  all_others:
