[project]
name = "chatuses"
version = "0.1.0"
description = "chat-uses control plane (brain): chat commands in, desktop input out"
readme = "README.md"
requires-python = ">=3.13"
# Runtime: aiohttp for the overlay feed (and later the admin API; discord.py
# builds on it too, PLAN.md D36). The brain image installs requirements.txt,
# exported from uv.lock with hashes (see README.md).
dependencies = [
    "aiohttp>=3.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "pyright>=1.1.400",
]

[project.scripts]
chatuses-sim = "chatuses.sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatuses"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings fail the tests: a socket, transport or database left open is a bug.
filterwarnings = ["error"]
