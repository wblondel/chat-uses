[project]
name = "chatuses"
version = "0.1.0"
description = "chat-uses control plane (brain): chat commands in, desktop input out"
readme = "README.md"
requires-python = ">=3.13"
# Runtime: aiohttp for the overlay feed (and later the admin API; discord.py
# builds on it too, PLAN.md D36). The brain image installs requirements.txt,
# exported from uv.lock with hashes (see README.md).
dependencies = [
    "aiohttp>=3.14",
    "discord-py>=2.7",
    "grpcio>=1.85.1",
    "protobuf>=7.36.2",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "pyright>=1.1.400",
    "grpcio-tools>=1.85.1",
    "types-protobuf>=7.35.1.20260906",
    "types-grpcio>=1.85.0.20261028",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
chatuses-sim = "chatuses.sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatuses"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["src/chatuses/adapters/stream_list_pb2.py", "src/chatuses/adapters/stream_list_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
# Generated by proto/generate.sh: not checked themselves, but their types
# still check the code that uses them.
exclude = ["src/chatuses/adapters/stream_list_pb2.py", "src/chatuses/adapters/stream_list_pb2.pyi"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings fail the tests: a socket, transport or database left open is a bug.
filterwarnings = ["error"]
