name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck if the image lacks it
        run: command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
      - name: Versions
        run: |
          grep PRETTY_NAME /etc/os-release
          shellcheck --version | sed -n 2p
          python3 --version
      - name: shellcheck
        run: shellcheck -x infra/host/*.sh infra/tests/*.sh
      - name: Pinned Zabbly key matches the fingerprint in bootstrap.sh
        run: |
          want=$(sed -n 's/^ZABBLY_FINGERPRINT="\([0-9A-F]*\)"$/\1/p' infra/host/bootstrap.sh)
          got=$(gpg --show-keys --with-colons infra/host/zabbly.asc | awk -F: '/^fpr/ {print $10; exit}')
          echo "expected ${want:-<missing>}, key file has ${got:-<none>}"
          test -n "$want" && test "$want" = "$got"
      - name: Discord setup tests
        run: python3 -W error::ResourceWarning -m unittest discover -s infra/discord -v
